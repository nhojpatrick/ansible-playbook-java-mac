---

- name: Override - JDK 22.0.0
  set_fact:
    jdk_dwnld_url: "https://download.oracle.com/java/22/archive/jdk-22_macos-x64_bin.tar.gz"
    jdk_archive_subdir: "jdk-22.jdk"
  when:
    - jdk_major == "22"
    - jdk_minor == "0"
    - jdk_build == "0"

- name: Override - JDK 22.0.1
  set_fact:
    jdk_dwnld_url: "https://download.oracle.com/java/22/archive/jdk-22.0.1_macos-x64_bin.tar.gz"
  when:
    - jdk_major == "22"
    - jdk_minor == "0"
    - jdk_build == "1"

- name: Override - JDK 22.0.2
  set_fact:
    jdk_dwnld_url: "https://download.oracle.com/java/22/archive/jdk-22.0.2_macos-x64_bin.tar.gz"
  when:
    - jdk_major == "22"
    - jdk_minor == "0"
    - jdk_build == "2"
